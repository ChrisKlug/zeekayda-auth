name: Mutation Testing

# Mutation testing is NOT a PR gate (#309 is deferred). It runs:
# - weekly on a schedule, so the baselines in CONTRIBUTING.md stay honest without anyone
#   remembering to ask (GitHub disables scheduled workflows after 60 days of repo inactivity);
# - workflow_dispatch for manual runs from main;
# - on a pull request ONLY when the 'mutation' label is applied to it.
on:
  schedule:
    # Sundays 03:00 UTC — off-peak for hosted runners, and a full day of headroom for the
    # 300-minute legs, so the reports are waiting on Monday morning.
    - cron: '0 3 * * 0'
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # The long-lived issue the scheduled run reports into. Its body is rewritten every run; a
  # comment is posted only when a score moves, so quiet weeks stay quiet.
  TRACKING_ISSUE: "589"

jobs:
  stryker:
    name: Stryker (${{ matrix.target }}${{ matrix.slice && format(' / {0}', matrix.slice) || '' }})
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'mutation'
    runs-on: ${{ matrix.os }}
    # A 4-vCPU hosted runner gives Stryker concurrency 3, and the MTP runner cannot yet filter
    # tests per mutant, so every covered mutant runs the full suite. The core target is split
    # into per-directory slices below to keep each leg's mutant count (and wall clock) bounded.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # ZeeKayDa.Auth is too large for one leg (~800 tested mutants ≈ 4.5h serial): the CLI
          # --mutate override narrows each leg to one directory of its config's mutate globs.
          - target: ZeeKayDa.Auth.Tests
            os: ubuntu-latest
            slice: tokens
            mutate_args: --mutate "**/Tokens/**/*.cs"
          - target: ZeeKayDa.Auth.Tests
            os: ubuntu-latest
            slice: clients
            mutate_args: --mutate "**/Clients/**/*.cs"
          - target: ZeeKayDa.Auth.Tests
            os: ubuntu-latest
            slice: security-authorization
            mutate_args: --mutate "**/Security/**/*.cs" --mutate "**/Authorization/**/*.cs"
          - target: ZeeKayDa.Auth.AspNetCore.Tests
            os: ubuntu-latest
          - target: ZeeKayDa.Auth.AzureKeyVault.Tests
            os: ubuntu-latest
          - target: ZeeKayDa.Auth.FileSystem.Tests
            os: ubuntu-latest
          # ZeeKayDa.Auth.Windows targets net10.0-windows and a third of its tests skip off
          # Windows, so windows-latest is the only runner that can produce an honest score for
          # it — not a portability check of the other targets, which stay on ubuntu-latest as
          # the single canonical baseline environment.
          - target: ZeeKayDa.Auth.Windows.Tests
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Run Stryker
        working-directory: tests/${{ matrix.target }}
        # Explicit bash: windows-latest defaults to pwsh, which has no tee/grep and treats
        # `>>` on $GITHUB_STEP_SUMMARY as UTF-16 redirection.
        shell: bash
        run: |
          dotnet tool restore
          dotnet tool run dotnet-stryker ${{ matrix.mutate_args }} | tee stryker.log
          {
            printf '%s' "${{ matrix.target }}${{ matrix.slice && format(' / {0}', matrix.slice) || '' }}: "
            grep -E "final mutation score" stryker.log || echo "no final score reported"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report-${{ matrix.target }}${{ matrix.slice && format('-{0}', matrix.slice) || '' }}
          path: tests/${{ matrix.target }}/StrykerOutput/**/reports/
          if-no-files-found: warn

  report:
    name: Report mutation scores
    needs: stryker
    # always(): a leg that failed produces no score, and that is itself the news the report exists
    # to carry — a skipped report job would hide it. Restricted to the unattended run and to a
    # manual run from main, so a `mutation`-labelled PR never rewrites the tracking issue with
    # scores measured on a branch.
    if: >-
      always()
      && (github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # Scoped to this job only: the matrix legs above keep the workflow-level `contents: read` and
    # never get write access to anything.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Download mutation reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-report-*
          path: ./mutation-artifacts

      - name: Read the tracking issue's current body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue view "$TRACKING_ISSUE" --json body --jq .body > ./previous-body.md

      - name: Build the report
        id: report
        run: |
          dotnet run .github/scripts/report_mutation_scores.cs -- \
            ./mutation-artifacts ./previous-body.md ./mutation-report "$(date -u +%Y-%m-%d)"
          cat ./mutation-report/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$TRACKING_ISSUE" --body-file ./mutation-report/body.md

      - name: Comment when a score moved
        if: steps.report.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$TRACKING_ISSUE" --body-file ./mutation-report/comment.md
