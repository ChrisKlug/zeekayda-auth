name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      non-docs: ${{ steps.filter.outputs.non-docs }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # dorny/paths-filter needs git history to diff against: the PR's merge-base for
          # pull_request events, or the pre-push commit for push events to main. A shallow
          # (default) checkout may not contain that commit.
          fetch-depth: 0

      # Required status checks (Build and Test (*), Format Check) must post exactly one check
      # run per name, always. This workflow used to skip entirely on docs-only changes via
      # paths-ignore, which required a companion stub workflow (ci-docs-skip.yml) to report the
      # same check names so branch protection wouldn't block on a missing check. On a PR that
      # touches both docs/** and non-docs files, GitHub's paths-ignore/paths filters aren't
      # mutually exclusive — this workflow still triggered (not everything was docs) and so did
      # the stub workflow (something was docs), so both posted the same check names and raced
      # (issue #416). Now ci.yml always triggers, ci-docs-skip.yml is gone, and jobs below gate
      # their expensive steps on this job's output instead — exactly one check run per required
      # name in every case, whether docs-only, code-only, or mixed.
      - name: Check for non-docs changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            non-docs:
              - '**'
              - '!docs/**'

  build-and-test:
    name: Build and Test
    needs: detect-changes
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache NuGet packages
        if: needs.detect-changes.outputs.non-docs == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        if: needs.detect-changes.outputs.non-docs == 'true'
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      # Platform-specific provider packages (ZeeKayDa.Auth.Windows today) have no business being
      # built or tested on any OS but their own. ZeeKayDa.Auth.FileSystem is the exception:
      # it is a portable, cross-platform provider (no P/Invoke, no OS-specific TFM) and must
      # build and test on every runner OS, so it appears in all three .slnf
      # files below. ZeeKayDa.Auth.slnx remains the single canonical solution — these are thin
      # solution *filters* (no duplicated project metadata) selecting which projects apply to each
      # runner OS, so a platform-specific package never gets pulled onto the wrong platform's leg.
      - name: Select solution
        if: needs.detect-changes.outputs.non-docs == 'true'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) echo "SOLUTION=ZeeKayDa.Auth.Windows.slnf" >> "$GITHUB_ENV" ;;
            macOS)   echo "SOLUTION=ZeeKayDa.Auth.MacOS.slnf" >> "$GITHUB_ENV" ;;
            Linux)   echo "SOLUTION=ZeeKayDa.Auth.Linux.slnf" >> "$GITHUB_ENV" ;;
          esac

      - name: Restore
        if: needs.detect-changes.outputs.non-docs == 'true'
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        if: needs.detect-changes.outputs.non-docs == 'true'
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Test
        if: needs.detect-changes.outputs.non-docs == 'true'
        run: dotnet test ${{ env.SOLUTION }} --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage-${{ matrix.os }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.detect-changes.outputs.non-docs == 'true'
        with:
          name: coverage-${{ runner.os }}
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Coverage summary
        if: needs.detect-changes.outputs.non-docs == 'true'
        run: dotnet run .github/scripts/summarize_coverage.cs -- ./TestResults "${{ runner.os }}"

  coverage-regression:
    name: Coverage Regression
    needs: detect-changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.non-docs == 'true'
    permissions:
      contents: read
      actions: read
    env:
      # Tolerance covers run-to-run noise plus deliberately leaving obvious code untested (#560);
      # meaningful regressions still fail the gate.
      COVERAGE_ALLOWED_REGRESSION_PERCENT: '0.50'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Measure PR coverage
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

          # Packages are discovered from ZeeKayDa.Auth.slnx rather than hardcoded here, so a new
          # cross-platform signing-provider package (epic #282) gets covered automatically as soon
          # as it follows the tests/<Package>.Tests/ convention — see discover_coverage_projects.cs.
          while IFS= read -r package; do
            dotnet test "tests/${package}.Tests/" \
              --no-build --configuration Release \
              --collect:"XPlat Code Coverage" --results-directory ./TestResults/pr \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[${package}]*"
          done < <(dotnet run .github/scripts/discover_coverage_projects.cs -- .)

      # Rather than rebuild and retest the base branch from a git worktree (slow, and re-executes
      # the base branch's own test suite — including its own coverage-regression-script smoke
      # tests — as a side effect), reuse the coverage already produced by build-and-test's most
      # recent successful run on the base branch. That job already uploads a per-OS
      # coverage.cobertura.xml artifact on every push, scoped per-package the same way this job's
      # own Include-filtered measurement is (see the per-project coverage.runsettings files), so
      # its Linux artifact is equivalent input for this comparison without rerunning anything.
      #
      # A "successful" run on the base branch does not guarantee it has that artifact: a docs-only
      # push short-circuits build-and-test's steps (including the coverage upload) via the
      # detect-changes gate, while the overall run still reports success. Walk back through recent
      # successful runs until one that actually uploaded coverage-Linux is found.
      - name: Find latest successful build on ${{ github.base_ref }}
        id: base-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_ids=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${{ github.base_ref }}&event=push&status=success&per_page=20" --jq '.workflow_runs[].id')

          if [[ -z "${run_ids}" ]]; then
            echo "::error::No successful CI run found on ${{ github.base_ref }}"
            exit 1
          fi

          for run_id in ${run_ids}; do
            has_artifact=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.name == "coverage-Linux" and .expired == false)] | length')
            if [[ "${has_artifact}" -gt 0 ]]; then
              echo "Using base-branch coverage from run ${run_id}"
              echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::No successful CI run on ${{ github.base_ref }} with a coverage-Linux artifact found in the last 20 runs"
          exit 1

      - name: Download base-branch coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-Linux
          github-token: ${{ github.token }}
          run-id: ${{ steps.base-run.outputs.run-id }}
          path: ./TestResults/base

      - name: Check coverage regression
        run: dotnet run .github/scripts/check_coverage_regression.cs -- ./TestResults/pr ./TestResults/base

  analyzer-tests:
    name: Analyzer Tests
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.non-docs == 'true'

    # ZeeKayDa.Auth.Analyzers and its test project are deliberately outside ZeeKayDa.Auth.slnx —
    # see discover_coverage_projects.cs — so they never become a coverage-regression candidate:
    # a Roslyn analyzer's branch-coverage profile (syntax/symbol pattern matching with many
    # defensive early-return branches) doesn't fit the same bar as the framework packages. Built
    # and tested here as a standalone job instead, so it still runs on every PR without feeding
    # the coverage gate.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/ZeeKayDa.Auth.Analyzers.Tests/ZeeKayDa.Auth.Analyzers.Tests.csproj

      - name: Build
        run: dotnet build tests/ZeeKayDa.Auth.Analyzers.Tests/ZeeKayDa.Auth.Analyzers.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/ZeeKayDa.Auth.Analyzers.Tests/ZeeKayDa.Auth.Analyzers.Tests.csproj --no-build --configuration Release

  coverage-regression-script-tests:
    name: Coverage Regression Script Tests
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.non-docs == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json') }}
          restore-keys: |
            nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Run coverage-regression script smoke tests
        run: bash .github/scripts/tests/check_coverage_regression.tests.sh

      - name: Run coverage-summary script smoke tests
        run: bash .github/scripts/tests/summarize_coverage.tests.sh

      - name: Run coverage-project-discovery script smoke tests
        run: bash .github/scripts/tests/discover_coverage_projects.tests.sh

      - name: Run mutation-score report script smoke tests
        run: bash .github/scripts/tests/report_mutation_scores.tests.sh

  log-hygiene:
    name: Log Hygiene Check
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.non-docs == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Check log hygiene
        run: dotnet run .github/scripts/check_log_hygiene.cs -- .

      # Backstop for suppression channels pass C's model of severity resolution doesn't
      # cover (see check_log_hygiene.cs's own header comment) — a project deliberately
      # containing both known-bad snippets must still fail to build with both diagnostics
      # present. TreatWarningsAsErrors/WarningsAsErrors are cleared so only the two
      # diagnostics under test (both Error severity by default) decide pass/fail, not
      # incidental warnings from the intentionally bad canary code.
      - name: Run log-hygiene canary (expected to fail to build)
        run: |
          set +e
          dotnet build .github/scripts/canary/ZeeKayDa.Auth.LogHygieneCanary/ZeeKayDa.Auth.LogHygieneCanary.csproj \
            -p:TreatWarningsAsErrors=false -p:WarningsAsErrors= > canary-output.txt 2>&1
          canary_exit=$?
          cat canary-output.txt

          if [[ "${canary_exit}" -eq 0 ]]; then
            echo "::error::Log-hygiene canary built successfully — ZEEKAYDA0001/ZEEKAYDA0002 are not firing."
            exit 1
          fi

          missing=0
          for id in ZEEKAYDA0001 ZEEKAYDA0002; do
            if ! grep -q "${id}" canary-output.txt; then
              echo "::error::Log-hygiene canary did not report ${id}."
              missing=1
            fi
          done

          exit "${missing}"

  log-hygiene-script-tests:
    name: Log Hygiene Script Tests
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.non-docs == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Run log hygiene script smoke tests
        run: bash .github/scripts/tests/check_log_hygiene.tests.sh

  format-check:
    name: Format Check
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The decision register replaced numbered ADRs, which had grown to 4,270 lines across 14
      # documents despite a written "half a page" target. A written target didn't hold it, so the
      # build enforces it. Over the cap: cut words or split the topic — don't raise the cap.
      - name: Check decision register file length
        run: |
          limit=150
          status=0
          for f in docs/decisions/*.md; do
            case "$(basename "$f")" in
              README.md|security-sign-offs.md) continue ;;
              [0-9][0-9][0-9][0-9]-*) continue ;;  # legacy numbered ADR, pending migration
            esac
            lines=$(wc -l < "$f")
            if [ "$lines" -gt "$limit" ]; then
              echo "::error file=$f::$f is $lines lines, over the $limit-line cap. Cut words or split the topic."
              status=1
            fi
          done
          exit $status

      # Sign-off entries prove their claims by citing test names; nothing else stops a cited
      # test from being deleted or renamed while the sign-off keeps pointing at it (#565).
      # Runs unconditionally: docs-only PRs are exactly the ones that edit the sign-off file.
      - name: Check security sign-off citations
        run: bash .github/scripts/check_sign_off_citations.sh .

      - name: Run sign-off citation script smoke tests
        run: bash .github/scripts/tests/check_sign_off_citations.tests.sh

      - name: Setup .NET
        if: needs.detect-changes.outputs.non-docs == 'true'
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Restore
        if: needs.detect-changes.outputs.non-docs == 'true'
        run: dotnet restore

      - name: Check formatting
        if: needs.detect-changes.outputs.non-docs == 'true'
        # Explicit path required: with the per-OS ZeeKayDa.Auth.*.slnf filters alongside
        # ZeeKayDa.Auth.slnx, `dotnet format`'s auto-discovery (unlike restore/build/test, which
        # ignore .slnf files when no path is given) sees multiple candidate solution files and
        # errors. ZeeKayDa.Auth.slnx is the canonical, unfiltered solution, so it's the right one
        # to format-check in full — this job runs on ubuntu-latest only and, unlike execution/tests,
        # formatting analysis of ZeeKayDa.Auth.Windows's source builds and checks fine cross-platform.
        run: dotnet format ZeeKayDa.Auth.slnx --verify-no-changes

  ci-complete:
    name: CI Complete
    needs: [detect-changes, build-and-test, analyzer-tests, coverage-regression, coverage-regression-script-tests, log-hygiene, log-hygiene-script-tests, format-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
