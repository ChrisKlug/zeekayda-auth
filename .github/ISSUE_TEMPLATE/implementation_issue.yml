name: Implementation issue
description: One narrow, buildable piece of work
labels: ["type:task", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        One narrow issue = one buildable thing. If this can't start until another issue
        closes, say so below — it'll be wired up with GitHub's native `blocked by` relation.

        The API shape isn't decided here. That happens in conversation with the maintainer
        before any code is written, and lands on this issue as an `### Agreed shape` comment.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is this for, and why is it needed now?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope, and what is explicitly out of it?
      placeholder: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >
        Concrete and testable. Each one should name an observable behaviour someone could
        write a test against — "works correctly" is not a criterion.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: Spec alignment
      description: >
        The exact spec section this implements, if any (e.g. "RFC 7636 §4.3"). The spec always
        wins — flag any conflict here rather than resolving it in code.
    validations:
      required: false

  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: >
        Anything touching tokens, cryptography, endpoints, or storage. Leave blank if none.
        Never report a vulnerability here — use the private security advisory process.
    validations:
      required: false

  - type: textarea
    id: blocked-by
    attributes:
      label: Blocked by
      description: Issues that must close before this can start.
    validations:
      required: false
